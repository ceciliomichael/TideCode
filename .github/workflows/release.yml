name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Extract release notes
        run: node ./scripts/extract-release-notes.mjs "$RELEASE_TAG" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TideCode ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: false
          body_path: release-notes.md
          generate_release_notes: false

  build_and_publish:
    needs: create_release
    name: Build and Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      WORKFLOW_INPUT_VERSION: ${{ inputs.release_tag || '' }}
      NODE_OPTIONS: '--max-old-space-size=4096'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_command: npm run dist:win:publish
          - os: ubuntu-latest
            dist_command: npm run dist:linux:publish
          - os: macos-latest
            dist_command: npm run dist:mac:publish

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve build version
        run: node ./scripts/resolve-build-version.mjs

      - name: Build and publish
        run: ${{ matrix.dist_command }}

  finalize_release:
    needs: build_and_publish
    name: Finalize Release
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          generate_release_notes: false
