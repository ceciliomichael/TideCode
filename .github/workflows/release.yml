name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (example: 0.1.1)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_publish:
    name: Build and Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKFLOW_INPUT_VERSION: ${{ github.event.inputs.version || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_command: npm run dist:win:publish
          - os: ubuntu-latest
            dist_command: npm run dist:linux:publish
          - os: macos-13
            dist_command: npm run dist:mac:publish
          - os: macos-latest
            dist_command: npm run dist:mac:publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve build version
        run: node ./scripts/resolve-build-version.mjs

      - name: Build and publish
        run: ${{ matrix.dist_command }}

