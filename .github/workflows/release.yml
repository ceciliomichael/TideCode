name: Build and Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Extract release notes
        run: node ./scripts/extract-release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TideCode ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: release-notes.md
          generate_release_notes: false

  build_and_publish:
    needs: create_release
    name: Build and Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKFLOW_INPUT_VERSION: ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_command: npm run dist:win:publish
          - os: ubuntu-latest
            dist_command: npm run dist:linux:publish
          - os: macos-latest
            dist_command: npm run dist:mac:publish

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve build version
        run: node ./scripts/resolve-build-version.mjs

      - name: Build and publish
        run: ${{ matrix.dist_command }}

  finalize_release:
    needs: build_and_publish
    name: Finalize Release
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: false
